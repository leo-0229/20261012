<body>
<main class="shell">
  <header><div><div class="eyebrow">02 · 공감하고 조정하는 대화</div><h1 class="logo">말<i>뜻</i></h1><p class="sub">뜻을 보고 단어가 떠오를 때까지, 가볍게 반복해요.</p></div><div class="progress-box"><div class="progress-top"><span>오늘의 학습</span><span id="masteryText">0 / 56</span></div><div class="progress"><span id="masteryBar"></span></div></div></header>

  <section id="quiz" class="panel"><div class="toolbar"><div class="count">띄어쓰기는 무시하지만 ‘하다’까지 정확히 써야 해요.</div><button class="pill" id="resetQuiz">기록 초기화</button></div><article class="card quiz-card"><div class="quiz-meta"><span id="quizNo">문제 1</span><span id="streak">연속 정답 0</span></div><div class="quiz-q" id="quizQuestion"></div><form class="answer-row" id="answerForm"><input id="answerInput" autocomplete="off" placeholder="단어를 입력하세요" aria-label="정답 단어"/><button>정답 확인</button></form><div class="feedback" id="feedback"></div><button class="next" id="nextQuiz">다음 문제 →</button><div class="stats"><div class="stat"><b id="correctStat">0</b><span>정답</span></div><div class="stat"><b id="wrongStat">0</b><span>다시 보기</span></div><div class="stat"><b id="rateStat">0%</b><span>정답률</span></div></div></article></section>
</main><div class="toast" id="toast"></div>

["담다","어떤 내용이나 사상을 그림, 글, 말, 표정 등의 속에 포함하거나 반영하다.",["내용이나 사상","포함하거나 반영"]],
["후세","다음에 오는 세상. 또는 다음 세대의 사람들.",["다음 세대"]],
["발전하다","더 낫고 좋은 상태나 더 높은 단계로 나아가다.",["더 낫고 좋은","높은 단계"]],
["인상","어떤 대상에 대하여 마음속에 새겨지는 느낌. ≒ 각인, 감명",["마음속에 새겨지는","느낌"]],
["아이디","인터넷에서, 이용자의 신분을 증명할 수 있는 고유의 체계. 문자나 숫자 등으로 이루어진다.",["이용자의 신분","고유의 체계"]],
["고민","어찌할 줄 몰라 괴로워하고 애를 태움.",["괴로워하고","애를 태움"]],
["라디오","방송국에서, 일정한 시간 안에 음악·드라마·뉴스·강연 등의 음성을 전파로 방송하여 수신 장치를 갖추고 있는 청취자들에게 듣게 하는 일. 또는 그런 방송 내용.",["음성을 전파로 방송","청취자들에게 듣게 하는 일"]],
["마련하다","헤아려서 갖추다. ≒ 갖추다",["헤아려서","갖추다"]],
["추천하다","어떤 조건에 적합한 대상을 책임지고 소개하다.",["적합한 대상","소개"]],
["등장인물","연극, 영화, 소설 등에 나오는 인물.",["연극, 영화, 소설","인물"]],
["소재","어떤 것을 만드는 데 바탕이 되는 재료.",["바탕이 되는","재료"]],

["대본","연극의 상연이나 영화 제작에 있어서 기본이 되는 글.",["연극의 상연이나 영화 제작","기본이 되는 글"]],
["관계","둘 이상의 사람, 사물, 현상 등이 서로 관련을 맺거나 관련이 있음. 또는 그런 관련.",["서로 관련","관련이 있음"]],
["진솔하다","진실하고 솔직하다. ≒ 솔직하다",["진실하고","솔직하다"]],
["양상","사물이나 현상의 모양이나 상태. ≒ 모습, 모양, 상태",["모양이나 상태"]],
["주제","대화나 연구 등에서 중심이 되는 문제.",["중심이 되는 문제"]],
["용기","씩씩하고 굳센 기운. 또는 사물을 겁내지 아니하는 기개.",["씩씩하고 굳센","겁내지 아니하는"]],
["기관","특별한 학술 기예를 장려하는 관직. 기정, 기좌, 기사 등을 이른다.",["학술 기예를 장려하는 관직"]],
["협의","둘 이상의 사람이 서로 협력하여 의논함.",["서로 협력","의논"]],
["해석","사물이나 행위 등의 내용을 판단하고 이해하는 일. 또는 그 내용.",["판단하고 이해"]]
].map((x,i)=>({id:i+1,term:x[0],meaning:x[1],keys:x[2]}));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let order=[...words], current=0, mastered=new Set(JSON.parse(localStorage.getItem('malttut-mastered')||'[]'));
const displayTerm=s=>s.replace(/\([^)]*\)/g,'');
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function highlight(w){let s=w.meaning;w.keys.forEach(k=>s=s.replace(new RegExp(esc(k),'g'),`<mark>${k}</mark>`));return s}
function updateMastery(){ $('#masteryText').textContent=`${mastered.size} / 56`;$('#masteryBar').style.width=`${mastered.size/56*100}%`;localStorage.setItem('malttut-mastered',JSON.stringify([...mastered])) }
function renderList(){ $('#wordList').innerHTML=order.map((w,i)=>`<div class="word-row ${i===current?'focus':''}" data-i="${i}"><span class="num">${String(w.id).padStart(2,'0')}</span><span class="term">${displayTerm(w.term)}</span><span class="meaning">${highlight(w)}</span></div>`).join('');$$('.word-row').forEach(r=>r.onclick=()=>{current=+r.dataset.i;renderList();renderStudy()}) }
function renderStudy(){let w=order[current];$('#studyCard').innerHTML=`<div><span class="index">WORD ${String(w.id).padStart(2,'0')}</span><h2>${displayTerm(w.term)}</h2><div class="definition">${highlight(w)}</div></div><div><p class="hint">뜻을 소리 내어 읽고 단어를 가려서 떠올려 보세요.</p><div class="card-actions"><button id="prev">이전</button><button id="again">다시 볼래요</button><button class="know" id="know">외웠어요 ✓</button><button id="next">다음</button></div></div>`;$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#again').onclick=()=>{mastered.delete(w.id);updateMastery();toast('다시 볼 단어로 표시했어요')};$('#know').onclick=()=>{mastered.add(w.id);updateMastery();toast('외운 단어에 추가했어요');move(1)}}
function move(n){current=(current+n+order.length)%order.length;renderList();renderStudy();document.querySelector(`[data-i="${current}"]`).scrollIntoView({block:'nearest'})}
$('#shuffleStudy').onclick=()=>{order=[...words].sort(()=>Math.random()-.5);current=0;renderList();renderStudy();toast('학습 순서를 섞었어요')};
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab,.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#'+t.dataset.tab).classList.add('active');if(t.dataset.tab==='match')setTimeout(drawLines,50);if(t.dataset.tab==='quiz')$('#answerInput').focus()});
let matchSet=[],selectedTerm=null,selectedMean=null,matched=new Set();
function shuffle(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
let matchDeck=[],quizDeck=[];
function sample(n){const picked=[];while(picked.length<n){if(!matchDeck.length)matchDeck=shuffle(words);const index=matchDeck.findIndex(w=>!picked.some(p=>p.id===w.id));if(index<0){matchDeck=shuffle(words);continue}picked.push(matchDeck.splice(index,1)[0])}return picked}
function newMatch(){matchSet=sample(6);selectedTerm=selectedMean=null;matched=new Set();$('#terms').innerHTML=matchSet.map(w=>`<button class="match-item term-m" data-id="${w.id}">${displayTerm(w.term)}</button>`).join('');$('#meanings').innerHTML=[...matchSet].sort(()=>Math.random()-.5).map(w=>`<button class="match-item mean mean-m" data-id="${w.id}">${highlight(w)}</button>`).join('');$$('.match-item').forEach(b=>b.onclick=()=>pickMatch(b));$('#matchScore').textContent='0 / 6';$('#matchFooter').textContent='정답인 두 항목을 고르면 선이 그어집니다.';drawLines()}
function pickMatch(b){if(b.classList.contains('done'))return;let isTerm=b.classList.contains('term-m');$$(isTerm?'.term-m':'.mean-m').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(isTerm)selectedTerm=b;else selectedMean=b;if(selectedTerm&&selectedMean){if(selectedTerm.dataset.id===selectedMean.dataset.id){let id=+selectedTerm.dataset.id;matched.add(id);selectedTerm.classList.replace('selected','done');selectedMean.classList.replace('selected','done');selectedTerm=selectedMean=null;$('#matchScore').textContent=`${matched.size} / 6`;drawLines();if(matched.size===6){$('#matchFooter').textContent='완벽해요! 여섯 쌍을 모두 연결했어요.';toast('매칭 완료!')} }else{let a=selectedTerm,c=selectedMean;a.classList.add('wrong');c.classList.add('wrong');setTimeout(()=>{a.classList.remove('wrong','selected');c.classList.remove('wrong','selected')},350);selectedTerm=selectedMean=null}}}
function drawLines(){let board=$('#matchBoard'),svg=$('#matchLines');if(!board||!svg)return;let br=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${br.width} ${br.height}`);svg.innerHTML=[...matched].map(id=>{let a=document.querySelector(`.term-m[data-id="${id}"]`),b=document.querySelector(`.mean-m[data-id="${id}"]`);if(!a||!b)return'';let ar=a.getBoundingClientRect(),bb=b.getBoundingClientRect();return `<line x1="${ar.right-br.left}" y1="${ar.top+ar.height/2-br.top}" x2="${bb.left-br.left}" y2="${bb.top+bb.height/2-br.top}"/>`}).join('')}
window.addEventListener('resize',drawLines);$('#newMatch').onclick=newMatch;
let quizWord=null,qNo=0,correct=0,wrong=0,streak=0,locked=false;
function normalize(s){return s.replace(/\([^)]*\)/g,'').replace(/[\s·.,/]/g,'')}
function nextQuiz(){if(!quizDeck.length){quizDeck=shuffle(words);if(quizWord&&quizDeck[quizDeck.length-1].id===quizWord.id)[quizDeck[0],quizDeck[quizDeck.length-1]]=[quizDeck[quizDeck.length-1],quizDeck[0]]}quizWord=quizDeck.pop();qNo++;locked=false;$('#quizNo').textContent=`문제 ${qNo} · ${Math.floor((qNo-1)/words.length)+1}회차`;$('#quizQuestion').innerHTML=highlight(quizWord);$('#answerInput').value='';$('#answerInput').disabled=false;$('#feedback').className='feedback';$('#nextQuiz').style.display='none';$('#answerInput').focus()}
$('#answerForm').onsubmit=e=>{e.preventDefault();if(locked)return;let val=$('#answerInput').value.trim();if(!val){toast('단어를 먼저 입력해 주세요');return}locked=true;let ok=normalize(val)===normalize(quizWord.term);$('#answerInput').disabled=true;let f=$('#feedback');f.className=`feedback show ${ok?'good':'bad'}`;if(ok){correct++;streak++;f.innerHTML=`<strong>정답이에요!</strong>${displayTerm(quizWord.term)}`;updateMastery()}else{wrong++;streak=0;f.innerHTML=`<strong>정답은 ‘${displayTerm(quizWord.term)}’</strong>입력한 답: ${val}`;}renderQuizMark();$('#streak').textContent=`연속 정답 ${streak}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrong;$('#rateStat').textContent=Math.round(correct/(correct+wrong)*100)+'%';$('#nextQuiz').style.display='block'};
$('#nextQuiz').onclick=nextQuiz;$('#resetQuiz').onclick=()=>{qNo=correct=wrong=streak=0;$('#correctStat').textContent=$('#wrongStat').textContent='0';$('#rateStat').textContent='0%';$('#streak').textContent='연속 정답 0';nextQuiz();toast('퀴즈 기록을 초기화했어요')};
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
let review;
try{review=new Set(JSON.parse(localStorage.getItem('malttut-review')||'[]'))}catch{review=new Set()}
let studyFilter='all';
const filters=document.createElement('div');filters.className='study-filters';filters.innerHTML='<button class="pill" data-filter="all">전체</button><button class="pill" data-filter="known">외운 단어</button><button class="pill" data-filter="review">다시 볼 단어</button>';$('#learn .toolbar').after(filters);
function statusLabel(w){return mastered.has(w.id)?'외웠어요 ✓':review.has(w.id)?'다시 볼 단어':'학습 전'}
function filteredWords(){return words.filter(w=>studyFilter==='all'||(studyFilter==='known'?mastered.has(w.id):review.has(w.id)))}
function refreshFilters(){$$('[data-filter]').forEach(b=>{const k=b.dataset.filter;b.textContent=(k==='all'?'전체':k==='known'?'외운 단어':'다시 볼 단어')+' '+(k==='all'?words.length:k==='known'?mastered.size:review.size);b.classList.toggle('primary',k===studyFilter);b.setAttribute('aria-pressed',String(k===studyFilter))})}
const saveMastery=updateMastery;
updateMastery=function(){for(const id of mastered)review.delete(id);saveMastery();localStorage.setItem('malttut-review',JSON.stringify([...review]));refreshFilters()};
const originalRenderList=renderList;
renderList=function(){if(!order.length){$('#wordList').innerHTML='<p class="empty-note">이 목록에 저장된 단어가 없어요.</p>';return}originalRenderList();$$('.word-row').forEach((r,i)=>{const badge=document.createElement('small');badge.className='word-status';badge.textContent=statusLabel(order[i]);r.querySelector('.term').append(badge)})};
const originalRenderStudy=renderStudy;
renderStudy=function(){if(!order.length){$('#studyCard').innerHTML='<div class="empty-note">이 목록에 단어가 없어요.<br>전체 목록에서 단어를 선택해 주세요.</div>';return}originalRenderStudy();const w=order[current];const badge=document.createElement('span');badge.className='card-status';badge.textContent=statusLabel(w);$('#studyCard .index').after(badge);$('#again').textContent=review.has(w.id)?'다시 볼래요 ✓':'다시 볼래요';$('#know').textContent=mastered.has(w.id)?'외운 단어 ✓':'외웠어요';$('#again').setAttribute('aria-pressed',String(review.has(w.id)));$('#know').setAttribute('aria-pressed',String(mastered.has(w.id)));$('#again').onclick=()=>markWord(w,false);$('#know').onclick=()=>markWord(w,true)};
function markWord(w,known){if(known){mastered.add(w.id);review.delete(w.id)}else{mastered.delete(w.id);review.add(w.id)}updateMastery();if(studyFilter!=='all'){order=filteredWords();current=Math.min(current,Math.max(0,order.length-1))}renderList();renderStudy();toast('‘'+displayTerm(w.term)+'’ '+(known?'외운 단어에 저장했어요':'복습 목록에 저장했어요'))}
const originalMove=move;move=function(n){if(order.length)originalMove(n)};
$$('[data-filter]').forEach(b=>b.onclick=()=>{studyFilter=b.dataset.filter;order=filteredWords();current=0;renderList();renderStudy();refreshFilters();if(studyFilter!=='all'){$('.study').classList.add('mobile-list-open');const toggle=$('.mobile-list-toggle');if(toggle){toggle.setAttribute('aria-expanded','true');toggle.textContent='단어 목록 접기 ▴'}}});
$('#shuffleStudy').onclick=()=>{order=shuffle(filteredWords());current=0;renderList();renderStudy();toast('선택한 목록의 순서를 섞었어요')};
const quizMark=document.createElement('div');quizMark.id='quizMark';quizMark.className='quiz-mark';quizMark.hidden=true;$('#nextQuiz').before(quizMark);
function renderQuizMark(){quizMark.hidden=false;quizMark.innerHTML='<p>이 단어를 외웠나요? 직접 표시해 주세요.</p><div class="quiz-mark-buttons"><button class="pill" id="quizAgain">다시 볼래요</button><button class="pill primary" id="quizKnow">외웠어요 ✓</button></div><p class="quiz-status"></p>';function refresh(){$('#quizMark .quiz-status').textContent=statusLabel(quizWord);$('#quizKnow').setAttribute('aria-pressed',String(mastered.has(quizWord.id)));$('#quizAgain').setAttribute('aria-pressed',String(review.has(quizWord.id)))}$('#quizKnow').onclick=()=>{markWord(quizWord,true);refresh()};$('#quizAgain').onclick=()=>{markWord(quizWord,false);refresh()};refresh()}
const originalNextQuiz=nextQuiz;nextQuiz=function(){quizMark.hidden=true;originalNextQuiz()};$('#nextQuiz').onclick=()=>nextQuiz();
const clearButton=document.createElement('button');clearButton.className='clear-data';clearButton.textContent='저장된 학습 데이터 삭제';$('.shell').append(clearButton);
clearButton.onclick=()=>{if(!confirm('외운 단어와 복습 목록, 현재 테스트 기록을 모두 삭제할까요? 삭제 후에는 되돌릴 수 없어요.'))return;localStorage.removeItem('malttut-mastered');localStorage.removeItem('malttut-review');mastered.clear();review.clear();studyFilter='all';order=[...words];current=0;updateMastery();renderList();renderStudy();quizDeck=[];matchDeck=[];$('#resetQuiz').click();newMatch();toast('저장된 학습 데이터를 삭제했어요')};
renderList();renderStudy();updateMastery();newMatch();nextQuiz();
const listToggle=document.createElement('button');
listToggle.className='mobile-list-toggle';
listToggle.textContent='전체 단어 목록 보기 ▾';
listToggle.setAttribute('aria-expanded','false');
listToggle.setAttribute('aria-controls','wordList');
$('.study').append(listToggle);
listToggle.onclick=()=>{const open=$('.study').classList.toggle('mobile-list-open');listToggle.setAttribute('aria-expanded',String(open));listToggle.textContent=open?'단어 목록 접기 ▴':'전체 단어 목록 보기 ▾'};
</script></body></html>
